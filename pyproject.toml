[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakshi-cos"
version = "0.1.0"
description = "Meta-cognitive infrastructure for reliable long-horizon AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []   # core runs with the standard library only

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
embed = ["sentence-transformers>=3.0"]
full = ["anthropic>=0.40", "sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
sakshi = "sakshi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
